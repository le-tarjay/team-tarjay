name: Team Targét Infrastructure

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/**"
      - ".github/workflows/infrastructure.yml"
  pull_request:
    paths:
      - "infrastructure/**"
      - ".github/workflows/infrastructure.yml"
  workflow_dispatch: {}

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: infrastructure

jobs:
  test:
    # Unlike the frontend and backend jobs, this one keeps the original
    # "Lint, type-check, and test" name, because here all three are real and
    # each is its own step: ruff lints, mypy type-checks (strict, per
    # pyproject.toml), pytest tests. The siblings renamed themselves to
    # "Build and test" precisely because they could not say that.
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    env:
      # Pinned rather than floating. poetry.lock's own header records that it
      # was generated by Poetry 2.4.3 and declares lock-version 2.1, and
      # pyproject.toml is the [project] + [tool.poetry.group.dev.dependencies]
      # layout that needs poetry-core >= 2. A Poetry 1.x runner default would
      # not read this project correctly, and a future 3.x could stop reading
      # this lock file. Verified against 2.4.3.
      POETRY_VERSION: "2.4.3"
      # CI should never sit on a prompt. Poetry's prompts are rare, but a
      # blocked prompt reads as an infrastructure timeout rather than a
      # failure, which is the expensive way to find out.
      POETRY_NO_INTERACTION: "1"
      # Puts the virtualenv at infrastructure/.venv instead of under
      # ~/.cache/pypoetry/virtualenvs/<name>-<hash>-<py>, whose directory name
      # embeds a hash this workflow would have to predict in order to cache
      # it. .gitignore already ignores .venv/.
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
    # Install is ~10s on a warm cache and the whole suite is ~13s (132 tests),
    # so this job has a large margin. It is here for the hang case, not the
    # slow case: the default job timeout is 360 minutes, which would burn a
    # full CI budget before reporting a stuck runner.
    timeout-minutes: 15
    steps:
      # Deliberately a full-repository checkout, not a sparse one limited to
      # infrastructure/. tests/test_local_stack.py's
      # test_the_build_context_and_dockerfile_resolve_to_real_paths asserts
      # that the compose build contexts `../../backend` and `../../frontend`
      # resolve to real directories containing real Dockerfiles, so the suite
      # reads two sibling surfaces from disk. Verified: with only
      # infrastructure/ present, those two parametrized cases fail. Adding a
      # sparse-checkout filter here to "only fetch what this surface needs"
      # would break them.
      - uses: actions/checkout@v4

      # 3.11 is pinned three times over in this surface's own config and all
      # three agree: pyproject.toml's requires-python is ">=3.11,<4.0",
      # [tool.mypy] sets python_version = "3.11", and [tool.ruff] sets
      # target-version = "py311". Taking the runner image's default Python
      # would mean linting and type-checking against a version the config does
      # not describe, and what ubuntu-latest preinstalls changes without
      # notice. Verified against 3.11.2.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Not incidental, and the reason this job needs Node at all: cdktn is a
      # jsii package, and jsii executes the real TypeScript SDK by spawning a
      # `node` child process from Python. tests/test_network_vpc.py calls
      # Testing.synth(...) across that bridge, so with no `node` on PATH the
      # file raises FileNotFoundError: 'node' at *collection* time. Verified
      # both ways: present, the suite is 132 passed; absent, pytest exits 2
      # with "Interrupted: 1 error during collection".
      #
      # 22 matches the frontend job's pin and satisfies jsii 1.139.0. No
      # cache/cache-dependency-path here on purpose — this surface has no
      # package.json and installs nothing from npm; Node is only ever the
      # interpreter jsii shells out to.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # pipx rather than `pip install poetry`: it puts Poetry in its own
      # isolated environment, so Poetry's own dependency tree can never be
      # resolved against — or quietly land in — the project virtualenv it is
      # managing. pipx is preinstalled on ubuntu-latest and installs into
      # ~/.local/bin, which is already on PATH there.
      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      # Exact key only, with no restore-keys, which is the opposite of the
      # backend job's NuGet cache and deliberate. That cache holds immutable
      # downloaded packages, where a partial hit is a strict win. This one
      # holds the resolved virtualenv — the environment the checks actually
      # execute in. `poetry install` adds and updates but does not remove
      # extraneous packages without --sync, so a venv restored from a
      # near-miss key could keep a stale transitive dependency alive and let
      # mypy resolve an import that a clean install would not have. A miss
      # costs ~10s of reinstall; a wrong hit costs a green check that means
      # nothing. The Python and Poetry versions are in the key because the
      # venv is built by and for both.
      #
      # hashFiles patterns are repository-root-relative. defaults.run
      # .working-directory applies only to `run` steps, never to `uses:`
      # steps, so an `infrastructure`-relative pattern here would match
      # nothing and the cache would key on the empty string for every run.
      - name: Cache the Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: infrastructure/.venv
          key: ${{ runner.os }}-poetry-venv-py3.11-${{ env.POETRY_VERSION }}-${{ hashFiles('infrastructure/poetry.lock') }}

      # --no-root is load-bearing, not a tidy-up, and it is why this step does
      # not read exactly as CLAUDE.md documents it.
      #
      # A bare `poetry install` fails on this project today, exit 1: "The
      # current project could not be installed: No file/folder found for
      # package infrastructure". pyproject.toml declares name = "infrastructure"
      # but there is no infrastructure/infrastructure/ package and no
      # packages/py-modules entry, so Poetry finds nothing to install as the
      # root project. That is correct for what this surface is — a CDKTN
      # application entered through main.py, never a distribution anything
      # imports — and nothing here or in any other surface imports an
      # `infrastructure` package.
      #
      # So --no-root asks for what this project actually wants: the
      # dependencies, not itself. It does not weaken the check. Every
      # dependency in poetry.lock is still installed, and ruff, mypy and
      # pytest all still see the full source tree, because they are pointed at
      # the working directory rather than at an installed package. Verified:
      # identical results under both invocations, once the root-install error
      # is out of the way.
      #
      # The durable fix is `package-mode = false` in [tool.poetry], which
      # would make a bare `poetry install` succeed and let this step match the
      # documented command. That edits this surface's project config to make a
      # check pass, which LET-126's scope boundary forbids, so it is reported
      # rather than done here.
      - name: Install dependencies
        run: poetry install --no-root

      # Three separate steps rather than one chained command, so a failure
      # names which tool broke. A lint violation, a type error and a test
      # failure want different responses, and one combined step makes them
      # look alike in the checks UI. Order is cheapest-first.
      - name: Lint
        run: poetry run ruff check .

      - name: Type-check
        run: poetry run mypy .

      # Runs this surface's one test level (infrastructure/CONVENTIONS.md,
      # Test levels), across all three test files: the construct-synth test in
      # test_network_vpc.py and LET-119's two data-file suites,
      # test_local_stack.py and test_local_realm.py. The latter two are
      # assertions over the compose stack's own YAML and the Keycloak realm
      # export rather than synth tests, and they run here like any other test
      # — they are not filtered out for not matching the surface's usual
      # shape. Expect 132 passed; pyproject.toml's testpaths = ["tests"]
      # selects them.
      #
      # A collection error fails this step rather than passing it as "0 tests
      # ran" — pytest exits 2 on collection failure. Verified with a
      # deliberately unimportable test module.
      #
      # What this step does NOT cover: infrastructure/local/ is a compose
      # file, two Dockerfiles, an nginx config and a realm export. ruff, mypy
      # and pytest read none of them as configuration — only
      # test_local_stack.py's and test_local_realm.py's assertions look at
      # them at all, and those check specific invariants rather than validating
      # the stack. A green check here does not mean `docker compose up`
      # succeeds. Whether this workflow should also run `docker compose config`
      # is an open question raised on LET-126 and not answered; the Python
      # checks are this job's scope.
      - name: Test
        run: poetry run pytest
