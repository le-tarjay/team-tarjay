<div class="login-page d-flex align-items-center justify-content-center min-vh-100">
  <main class="card login-card border-0 shadow-sm">
    <div class="card-body p-4 p-lg-5">
      <div class="mb-4 text-center">
        <div class="brand-mark mx-auto mb-3">
          LT
        </div>

        <h1 class="h3 mb-1">
          Le Targét POS
        </h1>

        <p class="text-secondary mb-0">
          Employee sign in
        </p>
      </div>

      <form (ngSubmit)="login()">
        <div class="mb-3">
          <label for="employeeId" class="form-label">
            Employee ID
          </label>

          <input
            id="employeeId"
            name="employeeId"
            type="text"
            class="form-control form-control-lg"
            autocomplete="username"
            [ngModel]="employeeId()"
            (ngModelChange)="employeeId.set($event)"
          />
        </div>

        <div class="mb-3">
          <label for="pin" class="form-label">
            PIN
          </label>

          <input
            id="pin"
            name="pin"
            type="password"
            class="form-control form-control-lg"
            autocomplete="current-password"
            [ngModel]="pin()"
            (ngModelChange)="pin.set($event)"
          />
        </div>

        @if (errorMessage()) {
          <div class="alert alert-danger py-2" role="alert">
            {{ errorMessage() }}
          </div>
        }

        <button
          type="submit"
          class="btn btn-primary btn-lg w-100"
          [disabled]="isLoading()"
        >
          @if (isLoading()) {
            <span
              class="spinner-border spinner-border-sm me-2"
              aria-hidden="true"
            ></span>
            Signing in...
          } @else {
            Sign in
          }
        </button>
      </form>
    </div>
  </main>
</div>
