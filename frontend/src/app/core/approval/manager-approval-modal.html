@if (!isClosed()) {
  <div class="approval-backdrop d-flex align-items-center justify-content-center">
    <section
      #dialog
      class="approval-dialog card border-0"
      role="dialog"
      aria-modal="true"
      aria-labelledby="manager-approval-title"
      aria-describedby="manager-approval-reason"
      tabindex="-1"
    >
      <header class="approval-header">
        <div class="d-flex align-items-center gap-2 mb-2">
          <span class="approval-mark" aria-hidden="true">
            <span></span>
          </span>
          <span class="approval-eyebrow">Manager approval</span>
        </div>

        <h2 id="manager-approval-title" class="approval-title mb-0">
          {{ title() }}
        </h2>

        <p id="manager-approval-reason" class="approval-reason mb-0">
          {{ reason() }}
        </p>
      </header>

      <div class="approval-body">
        <div class="mb-3">
          <label for="manager-approval-employee-id" class="approval-field-label">
            Manager Employee ID
          </label>

          <output
            id="manager-approval-employee-id"
            class="approval-field approval-employee-id"
            [class.active]="activeField() === 'employeeId'"
          >
            {{ employeeId() }}
          </output>
        </div>

        <div class="mb-3">
          <label for="manager-approval-pin" class="approval-field-label">
            Manager PIN
          </label>

          <output
            id="manager-approval-pin"
            class="approval-field approval-pin d-flex justify-content-center gap-3"
            [class.active]="activeField() === 'pin'"
          >
            @for (slot of pinSlots; track slot) {
              <span
                class="pin-dot"
                [class.filled]="slot < pin().length"
                aria-hidden="true"
              ></span>
            }

            <span class="visually-hidden">
              {{ pin().length }} of {{ pinLength }} digits entered
            </span>
          </output>
        </div>

        @if (errorMessage()) {
          <div class="approval-error" role="alert">
            {{ errorMessage() }}
          </div>
        }

        <div class="approval-keypad mb-3">
          @for (key of keypad; track key.label) {
            <button
              type="button"
              class="keypad-key"
              [class.keypad-clear]="key.action === 'clear'"
              [attr.aria-label]="key.ariaLabel"
              [disabled]="isChecking()"
              (click)="press(key)"
            >
              {{ key.label }}
            </button>
          }
        </div>

        <div class="d-flex gap-2">
          <button
            type="button"
            class="btn btn-outline-secondary btn-lg approval-cancel"
            [disabled]="isChecking()"
            (click)="cancel()"
          >
            Cancel
          </button>

          <button
            type="button"
            class="btn btn-primary btn-lg flex-grow-1"
            [disabled]="!canConfirm()"
            (click)="approve()"
          >
            @if (isChecking()) {
              Checking…
            } @else {
              {{ confirmLabel() }}
            }
          </button>
        </div>
      </div>
    </section>
  </div>
}
