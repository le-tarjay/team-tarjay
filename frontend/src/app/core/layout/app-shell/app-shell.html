<nav class="navbar navbar-expand navbar-dark app-navbar px-4">
  <a class="navbar-brand fw-semibold" routerLink="/sale">
    Le Targét POS
  </a>

  <div class="navbar-nav me-auto">
    @for (item of navItems(); track item.label) {
      @if (item.route; as route) {
        <a
          class="nav-link"
          [routerLink]="route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: isExactLink(item) }"
        >
          {{ item.label }}
        </a>
      } @else {
        <button
          type="button"
          class="nav-link disabled"
          disabled
        >
          {{ item.label }}
        </button>
      }
    }
  </div>

  <div class="d-flex align-items-center gap-3">
    @if (identityLabel(); as identity) {
      <span class="navbar-text small">
        {{ identity }}
      </span>
    }

    <div class="dropdown">
      <button
        type="button"
        class="btn btn-outline-light btn-sm dropdown-toggle"
        [attr.aria-expanded]="isAccountMenuOpen()"
        (click)="toggleAccountMenu()"
      >
        Account
      </button>

      @if (isAccountMenuOpen()) {
        <div class="dropdown-menu dropdown-menu-end show">
          @for (item of accountMenuItems(); track item.label) {
            <button
              type="button"
              class="dropdown-item disabled"
              disabled
            >
              {{ item.label }}
            </button>
          }

          @if (accountMenuItems().length > 0) {
            <hr class="dropdown-divider" />
          }

          <button
            type="button"
            class="dropdown-item"
            (click)="logout()"
          >
            Logout
          </button>
        </div>
      }
    </div>
  </div>
</nav>

<main class="app-main">
  <router-outlet />
</main>
