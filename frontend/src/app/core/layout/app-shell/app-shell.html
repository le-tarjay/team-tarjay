<nav class="navbar navbar-expand navbar-dark app-navbar px-4">
  <a class="navbar-brand fw-semibold" routerLink="/sale">
    Le Targét POS
  </a>

  <div class="navbar-nav me-auto">
    <a
      class="nav-link"
      routerLink="/sale"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Sale
    </a>

    <a
      class="nav-link"
      routerLink="/products"
      routerLinkActive="active"
    >
      Products
    </a>

    <a
      class="nav-link"
      routerLink="/sales"
      routerLinkActive="active"
    >
      Sales
    </a>

    <a
      class="nav-link"
      routerLink="/buyers"
      routerLinkActive="active"
    >
      Buyers
    </a>
  </div>

  <div class="d-flex align-items-center gap-3">
    @if (currentEmployee(); as employee) {
      <div class="identity-menu">
        <button
          type="button"
          class="btn btn-link p-0 border-0 text-decoration-none text-white d-flex align-items-center gap-2 identity-toggle"
          (click)="toggleIdentityMenu()"
          aria-haspopup="menu"
          [attr.aria-expanded]="menuOpen()"
          [attr.aria-label]="'Account menu for ' + employee.name"
        >
          <span class="identity-avatar" aria-hidden="true">{{ initials() }}</span>
          <span class="d-flex flex-column align-items-start lh-sm">
            <strong>{{ employee.name }}</strong>
            <small class="text-white-50">{{ departmentRole() }}</small>
          </span>
        </button>

        @if (menuOpen()) {
          <div class="dropdown-menu show identity-menu-panel" role="menu">
            <button
              type="button"
              class="dropdown-item"
              role="menuitem"
              (click)="logout()"
            >
              Logout
            </button>
          </div>
        }
      </div>
    }
  </div>
</nav>

<main class="app-main">
  <router-outlet />
</main>
