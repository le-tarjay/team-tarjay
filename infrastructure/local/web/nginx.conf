# nginx server block for the `web` service in the local docker-compose stack.
#
# Bind-mounted to /etc/nginx/conf.d/default.conf by docker-compose.yml, replacing the
# stock block. It does two jobs: serve the production Angular bundle, and make the
# composed stack same-origin by routing /v1/* to the API.
#
# This is the composed stack's proxy rule only. The equivalent for the `ng serve` inner
# loop is a dev-server proxy and belongs to LET-121; nothing here touches angular.json.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Combined with the variable in proxy_pass below, this defers
    # resolution of `api` to request time. With a literal hostname, nginx resolves it
    # once at startup and refuses to start at all if the name is not yet resolvable --
    # so a slow or restarted `api` would take the whole `web` service down with it.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Same-origin API. This is what removes CORS from the equation for anyone using the
    # stack as a whole: the browser only ever talks to localhost:4200.
    #
    # AuthService posts to the relative path /v1/employees/sign-in, and the API routes
    # it at [Route("v1/employees")] -- so the prefix passes through unrewritten.
    location /v1/ {
        set $api_upstream http://api:8080;

        # $request_uri, not a bare $api_upstream: once proxy_pass contains a variable,
        # nginx stops appending the matched URI, and the path plus query string has to
        # be restored explicitly or every request arrives at the API as "/".
        proxy_pass $api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A sign-in is interactive and the API gives up on Keycloak after 5s
        # (KeycloakOptions.Timeout). Keep this longer than that, so the developer sees
        # the API's own "authority unreachable" answer rather than a 504 from nginx.
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # SPA deep links. The Angular router owns every non-/v1 path, so anything that is
    # not a real file has to fall through to index.html -- otherwise a reload on /login,
    # or a return-url redirect into a guarded route, answers 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
